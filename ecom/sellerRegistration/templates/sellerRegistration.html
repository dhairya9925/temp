<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration - MultiVendor MarketPlace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#1a1a2e',
                        darker: '#16213e',
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-gradient-to-br from-dark to-darker text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-6 bg-gray-800 rounded-lg shadow-md">
        <h2 class="text-3xl font-bold mb-6 text-center">Seller Registration</h2>
        <form>
            <div class="mb-4">
                <label for="business-name" class="block mb-2 text-sm font-medium">Business Name</label>
                <input type="text" id="business-name" class="w-full px-3 py-2 text-white bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block mb-2 text-sm font-medium">Business Email</label>
                <input type="email" id="email" class="w-full px-3 py-2 text-white bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-4">
                <label for="phone" class="block mb-2 text-sm font-medium">Phone Number</label>
                <input type="tel" id="phone" class="w-full px-3 py-2 text-white bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-4">
                <label for="address" class="block mb-2 text-sm font-medium">Business Address</label>
                <textarea id="address" rows="3" class="w-full px-3 py-2 text-white bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
            </div>
            <div class="mb-4">
                <label for="password" class="block mb-2 text-sm font-medium">Password</label>
                <input type="password" id="password" class="w-full px-3 py-2 text-white bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label for="confirm-password" class="block mb-2 text-sm font-medium">Confirm Password</label>
                <input type="password" id="confirm-password" class="w-full px-3 py-2 text-white bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                Register as Seller
            </button>
        </form>
        <p class="mt-4 text-center text-sm">
            Already have a seller account? <a href="../login" class="text-blue-400 hover:underline">Login here</a>
        </p>
    </div>
</body>
</html>
